name: Render Keep-Alive Pinger

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier from sleeping (sleep threshold is 15m)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Keep Alive Ping
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP GET to UniDocs
        run: |
          STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 30 https://unidocs-husc.pages.dev/api/health || true)
          echo "Pinged https://unidocs-husc.pages.dev/api/health - HTTP Status: $STATUS"
