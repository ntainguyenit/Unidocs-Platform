<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="dev.crypto">Mã hóa chuỗi (Crypto Hash) - UniDocs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div th:replace="~{fragments/base :: navbar}" th:with="hideExtraTools=true"></div>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl flex flex-col">
        <div class="flex items-center justify-between mb-4">
            <a th:href="@{/#utilities}" class="inline-flex items-center text-sm text-blue-600 hover:text-blue-800 font-medium transition-colors bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-lg border border-blue-100 shadow-sm">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Quay lại
            </a>
            <div class="flex items-center text-sm text-gray-500">
                <a th:href="@{/}" class="hover:text-blue-600 transition-colors">Trang chủ</a>
                <svg class="w-4 h-4 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                <span class="text-gray-900 font-medium">Băm dữ liệu (Hash)</span>
            </div>
        </div>

        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-4">Mã Hóa Chuỗi Ký Tự</h1>
            <p class="text-gray-600 max-w-2xl mx-auto">Chuyển đổi văn bản thành mã băm (hash) bằng Web Crypto API gốc. Dữ liệu của bạn được mã hóa ngay trên trình duyệt, không bao giờ gửi qua mạng.</p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 max-w-3xl mx-auto w-full">
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">Văn bản cần mã hóa (Input String)</label>
                <textarea id="inputText" rows="4" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-800 focus:border-blue-800 p-4 transition-colors font-mono" placeholder="Nhập mật khẩu hoặc văn bản bất kỳ..."></textarea>
            </div>

            <div class="space-y-4">
                <!-- SHA-1 -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 uppercase">SHA-1 (Insecure)</label>
                    <div class="flex">
                        <input type="text" id="hashSha1" readonly class="flex-grow bg-gray-100 border border-gray-300 border-r-0 text-gray-600 rounded-l-lg p-3 font-mono text-sm">
                        <button onclick="navigator.clipboard.writeText(document.getElementById('hashSha1').value); this.innerText='Đã chép!'; setTimeout(()=>this.innerText='Copy', 1500);" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 rounded-r-lg transition-colors text-sm w-24">Copy</button>
                    </div>
                </div>

                <!-- SHA-256 -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 uppercase">SHA-256 (Common)</label>
                    <div class="flex">
                        <input type="text" id="hashSha256" readonly class="flex-grow bg-gray-100 border border-gray-300 border-r-0 text-gray-900 font-bold rounded-l-lg p-3 font-mono text-sm">
                        <button onclick="navigator.clipboard.writeText(document.getElementById('hashSha256').value); this.innerText='Đã chép!'; setTimeout(()=>this.innerText='Copy', 1500);" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 rounded-r-lg transition-colors text-sm w-24">Copy</button>
                    </div>
                </div>

                <!-- SHA-512 -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1 uppercase">SHA-512 (Strongest)</label>
                    <div class="flex">
                        <input type="text" id="hashSha512" readonly class="flex-grow bg-gray-100 border border-gray-300 border-r-0 text-gray-900 rounded-l-lg p-3 font-mono text-xs">
                        <button onclick="navigator.clipboard.writeText(document.getElementById('hashSha512').value); this.innerText='Đã chép!'; setTimeout(()=>this.innerText='Copy', 1500);" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 rounded-r-lg transition-colors text-sm w-24">Copy</button>
                    </div>
                </div>
                
                <hr class="border-gray-200 my-6">

                <!-- HMAC -->
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <label class="block text-sm font-bold text-blue-900 mb-2">HMAC SHA-256</label>
                    <p class="text-xs text-blue-700 mb-3">HMAC yêu cầu một "Khóa bí mật" (Secret Key) để băm dữ liệu.</p>
                    <input type="text" id="hmacKey" class="w-full bg-white border border-blue-200 text-gray-900 rounded-lg focus:ring-blue-800 p-2.5 font-mono text-sm mb-3" placeholder="Nhập Secret Key...">
                    <div class="flex">
                        <input type="text" id="hashHmac" readonly class="flex-grow bg-white border border-blue-200 border-r-0 text-gray-900 rounded-l-lg p-3 font-mono text-sm">
                        <button onclick="navigator.clipboard.writeText(document.getElementById('hashHmac').value); this.innerText='Đã chép!'; setTimeout(()=>this.innerText='Copy', 1500);" class="bg-blue-800 hover:bg-blue-900 text-white font-medium px-4 rounded-r-lg transition-colors text-sm w-24">Copy</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/base :: footer}"></div>
    <!-- Script cần chạy dạng type="module" do dùng async/await native nhiều -->
    <script type="module" th:src="@{/js/crypto-hash.js}"></script>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
