<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="dev.formatter">Trình Định Dạng Code - UniDocs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- SQL Formatter -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql-formatter/12.2.3/sql-formatter.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-btn.active { border-bottom-width: 2px; border-color: #1e40af; color: #1e40af; font-weight: 600; }
        .calc-height { height: calc(100vh - 250px); min-height: 500px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div th:replace="~{fragments/base :: navbar}" th:with="hideExtraTools=true"></div>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-7xl flex flex-col">
        <div class="flex items-center justify-between mb-4">
            <a th:href="@{/#utilities}" class="inline-flex items-center text-sm text-blue-600 hover:text-blue-800 font-medium transition-colors bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-lg border border-blue-100 shadow-sm">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Quay lại
            </a>
            <div class="flex items-center text-sm text-gray-500">
                <a th:href="@{/}" class="hover:text-blue-600 transition-colors">Trang chủ</a>
                <svg class="w-4 h-4 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                <span class="text-gray-900 font-medium">Dev Tools</span>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex-grow flex flex-col">
            <!-- Tabs Header -->
            <div class="flex border-b border-gray-100 overflow-x-auto bg-gray-50 px-4">
                <button class="tab-btn active px-6 py-4 text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap" data-target="tab-json">JSON Formatter</button>
                <button class="tab-btn px-6 py-4 text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap" data-target="tab-sql">SQL Formatter</button>
                <button class="tab-btn px-6 py-4 text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap" data-target="tab-regex">Regex Tester</button>
            </div>

            <!-- JSON Tab -->
            <div id="tab-json" class="tab-content flex-grow flex flex-col md:flex-row block">
                <div class="w-full md:w-1/2 flex flex-col border-b md:border-b-0 md:border-r border-gray-200">
                    <div class="p-3 bg-gray-100 border-b border-gray-200 text-xs font-bold text-gray-600">INPUT JSON</div>
                    <textarea id="jsonInput" class="w-full flex-grow p-4 resize-none focus:outline-none bg-white text-gray-800 font-mono text-sm" placeholder='{"key": "value"}'></textarea>
                </div>
                <div class="w-full md:w-1/2 flex flex-col bg-gray-900">
                    <div class="p-3 bg-gray-800 border-b border-gray-700 text-xs font-bold text-gray-300 flex justify-between items-center">
                        <span>OUTPUT JSON (FORMATTED)</span>
                        <div class="flex gap-2">
                            <button id="jsonCopyBtn" class="text-xs bg-gray-700 hover:bg-gray-600 text-white px-2 py-1 rounded transition-colors">Copy Code</button>
                        </div>
                    </div>
                    <pre id="jsonOutput" class="w-full flex-grow p-4 overflow-auto text-green-400 font-mono text-sm m-0">Vui lòng nhập JSON hợp lệ ở bên trái.</pre>
                </div>
            </div>

            <!-- SQL Tab -->
            <div id="tab-sql" class="tab-content flex-grow flex flex-col md:flex-row hidden">
                <div class="w-full md:w-1/2 flex flex-col border-b md:border-b-0 md:border-r border-gray-200">
                    <div class="p-3 bg-gray-100 border-b border-gray-200 text-xs font-bold text-gray-600">INPUT SQL</div>
                    <textarea id="sqlInput" class="w-full flex-grow p-4 resize-none focus:outline-none bg-white text-gray-800 font-mono text-sm" placeholder="SELECT * FROM users WHERE age > 18"></textarea>
                </div>
                <div class="w-full md:w-1/2 flex flex-col bg-gray-900">
                    <div class="p-3 bg-gray-800 border-b border-gray-700 text-xs font-bold text-gray-300 flex justify-between items-center">
                        <span>OUTPUT SQL (FORMATTED)</span>
                        <button id="sqlCopyBtn" class="text-xs bg-gray-700 hover:bg-gray-600 text-white px-2 py-1 rounded transition-colors">Copy Code</button>
                    </div>
                    <pre id="sqlOutput" class="w-full flex-grow p-4 overflow-auto text-blue-400 font-mono text-sm m-0">Vui lòng nhập SQL ở bên trái.</pre>
                </div>
            </div>

            <!-- Regex Tab -->
            <div id="tab-regex" class="tab-content flex-grow flex flex-col p-6 hidden">
                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Biểu thức chính quy (Regular Expression)</label>
                    <div class="flex">
                        <span class="inline-flex items-center px-4 rounded-l-lg border border-r-0 border-gray-300 bg-gray-100 text-gray-500 font-mono text-lg">/</span>
                        <input type="text" id="regexInput" class="flex-grow bg-white border border-gray-300 text-gray-900 focus:ring-blue-800 focus:border-blue-800 p-3 font-mono text-lg" placeholder="^[a-zA-Z0-9]+$">
                        <input type="text" id="regexFlags" class="w-16 bg-white border border-gray-300 text-gray-900 rounded-r-lg focus:ring-blue-800 focus:border-blue-800 p-3 font-mono text-lg" placeholder="gi" value="g">
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 flex-grow">
                    <div class="flex flex-col">
                        <label class="block text-sm font-bold text-gray-700 mb-2">Chuỗi thử nghiệm (Test String)</label>
                        <textarea id="regexTestStr" class="w-full flex-grow p-4 resize-none border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-800 bg-white text-gray-800 font-mono text-sm" placeholder="Nhập chuỗi cần kiểm tra vào đây..."></textarea>
                    </div>
                    <div class="flex flex-col">
                        <label class="block text-sm font-bold text-gray-700 mb-2">Kết quả Match</label>
                        <div id="regexOutput" class="w-full flex-grow p-4 border border-gray-300 rounded-lg bg-gray-50 text-gray-800 font-mono text-sm overflow-auto whitespace-pre-wrap"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/base :: footer}"></div>
    <script th:src="@{/js/code-formatter.js}"></script>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
