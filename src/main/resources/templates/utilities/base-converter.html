<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="dev.baseconverter">Chuyển Đổi Hệ Cơ Số - UniDocs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div th:replace="~{fragments/base :: navbar}" th:with="hideExtraTools=true"></div>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl flex flex-col">
        <div class="flex items-center justify-between mb-4">
            <a th:href="@{/#utilities}" class="inline-flex items-center text-sm text-blue-600 hover:text-blue-800 font-medium transition-colors bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-lg border border-blue-100 shadow-sm">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Quay lại
            </a>
            <div class="flex items-center text-sm text-gray-500">
                <a th:href="@{/}" class="hover:text-blue-600 transition-colors">Trang chủ</a>
                <svg class="w-4 h-4 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                <span class="text-gray-900 font-medium">Hệ cơ số</span>
            </div>
        </div>

        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-4">Chuyển Đổi Hệ Cơ Số</h1>
            <p class="text-gray-600 max-w-2xl mx-auto">Công cụ đặc biệt hữu ích cho sinh viên học môn Kiến trúc Máy tính hoặc Mạng máy tính. Nhập vào bất kỳ ô nào, các ô còn lại sẽ tự nhảy số tương ứng.</p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-10 max-w-3xl mx-auto w-full">
            <div id="errorMsg" class="hidden mb-6 p-4 bg-red-50 text-red-600 rounded-lg text-sm border border-red-100 font-medium text-center"></div>

            <div class="space-y-6">
                <!-- Thập phân (Decimal - Base 10) -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Thập Phân (Decimal - Hệ 10)</label>
                    <input type="text" id="inpDec" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-800 focus:border-blue-800 p-4 font-mono text-xl transition-colors" placeholder="Ví dụ: 255">
                </div>

                <!-- Nhị phân (Binary - Base 2) -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Nhị Phân (Binary - Hệ 2)</label>
                    <input type="text" id="inpBin" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-800 focus:border-blue-800 p-4 font-mono text-xl transition-colors text-blue-700 tracking-wider" placeholder="Ví dụ: 11111111">
                </div>

                <!-- Thập lục phân (Hex - Base 16) -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Thập Lục Phân (Hexadecimal - Hệ 16)</label>
                    <input type="text" id="inpHex" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-800 focus:border-blue-800 p-4 font-mono text-xl transition-colors text-green-700 uppercase" placeholder="Ví dụ: FF">
                </div>

                <!-- Bát phân (Octal - Base 8) -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Bát Phân (Octal - Hệ 8)</label>
                    <input type="text" id="inpOct" class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-800 focus:border-blue-800 p-4 font-mono text-xl transition-colors text-purple-700" placeholder="Ví dụ: 377">
                </div>
            </div>

            <button id="clearBtn" class="mt-8 w-full border border-gray-300 text-gray-600 hover:bg-gray-100 font-bold py-3 px-4 rounded-lg transition-colors">
                Xóa toàn bộ
            </button>
        </div>
    </main>

    <div th:replace="~{fragments/base :: footer}"></div>
    <script th:src="@{/js/base-converter.js}"></script>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
