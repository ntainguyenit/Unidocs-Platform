# Spring Boot Test Configuration
spring.application.name=unidocs-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# Supabase S3 Mock Config for Tests
supabase.s3.endpoint=https://mock.supabase.co/storage/v1/s3
supabase.s3.region=ap-southeast-1
supabase.s3.access-key=mock-key
supabase.s3.secret-key=mock-secret
supabase.s3.bucket=documents

# Turnstile Mock Config
cloudflare.turnstile.site-key=mock-site-key
cloudflare.turnstile.secret-key=mock-secret-key
